name: Deploy React portfolio

on:
  push:
    branches: [main]
    paths:
      - 'Ooca/**'
      - '.github/workflows/deploy-react.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Ooca/**'
      - '.github/workflows/deploy-react.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ooca
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ooca/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate and build React Home and case pages
        run: npm run build
      - name: Record deployed revision
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > dist/revision.txt
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: Ooca/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy React portfolio
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
